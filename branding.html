<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branding and Design — Jasper Curtis</title>
<link rel="icon" href="images/cow-logo.png">
<style>
  /* Self-hosted (OFL) — no network dependency */
  @font-face {
    font-family: 'Monsieur La Doulaise';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/monsieur-la-doulaise-400-normal-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Monsieur La Doulaise';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/monsieur-la-doulaise-400-normal-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: #f7ffff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  /* Positions are percentages of the 1440×1024 Figma frame */
  .frame {
    position: relative;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Red-bordered portrait ── */
  .photo {
    position: absolute;
    left: 3.89%;   /* 56 / 1440  */
    top: 6.35%;    /* 65 / 1024  */
    width: 49.65%; /* 715 / 1440 */
    height: 87.3%; /* 894 / 1024 */
    border: 5px solid #f81010;
    overflow: hidden;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── Project list: label + script wordmarks ── */
  .projects {
    position: absolute;
    left: 59.10%;   /* 851 / 1440, the left edge Figma gives Band-Aid */
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(16px, 2.6vh, 30px);   /* label sits close to its list */
  }
  .project-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(30px, 5.2vh, 62px);   /* the links, well separated */
  }
  .projects-label {
    font-size: clamp(17px, 1.6vw, 23px);
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #000;
  }
  .project {
    font-family: "Monsieur La Doulaise", cursive;
    font-size: clamp(34px, 4.1vw, 58px);
    font-weight: 400;
    line-height: 1.1;
    color: #000;
    white-space: nowrap;
    /* a persistent rule under the whole word — the clearest "this is a
       link" cue for a script face, and it clears the long descenders */
    border-bottom: 1px solid #000;
    padding-bottom: 0.06em;
    text-decoration: none;
  }
  .project:hover { opacity: 0.55; }
  .project:focus-visible { outline: 2px solid #f81010; outline-offset: 8px; }
  @media (prefers-reduced-motion: no-preference) {
    .project { transition: opacity 0.2s ease; }
  }

  /* ── Cow head = home button, floats top-right ── */
  /* Adaptive logo: white artwork + difference blending inverts it against
     whatever sits behind, per pixel. Black over the white/off-white page,
     white over dark imagery or type, recomputed live while scrolling. */
  .home-cow {
    mix-blend-mode: difference;
    position: fixed;
    top: 28px;
    right: 32px;
    z-index: 10;
    display: block;
    transition: transform 0.2s ease;
  }
  .home-cow img {
    width: 50px;
    height: auto;
    display: block;
  }
  /* Where supported, threshold the backdrop inside the cow silhouette instead
     of inverting it: gives true black/white rather than a complementary tint
     over saturated colour. Falls back to the difference blend above. */
  @supports ((backdrop-filter: invert(1)) or (-webkit-backdrop-filter: invert(1))) and (mask-image: url(x.png)) {
    .home-cow { mix-blend-mode: normal; }
    .home-cow img { visibility: hidden; }
    .home-cow::after {
      content: "";
      position: absolute;
      inset: 0;
      -webkit-backdrop-filter: grayscale(1) contrast(2000%) invert(1);
      backdrop-filter: grayscale(1) contrast(2000%) invert(1);
      -webkit-mask: url(images/cow-logo-white.png) center / contain no-repeat;
      mask: url(images/cow-logo-white.png) center / contain no-repeat;
    }
  }
  .home-cow:hover,
  .home-cow.tapped { transform: rotate(-8deg); }
  .home-cow:focus-visible { outline: 2px solid #f81010; outline-offset: 4px; }

  /* ── Mobile: stack the portrait over the wordmarks ── */
  @media (max-width: 760px) {
    .frame {
      height: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 88px 24px 48px;
    }
    .photo {
      position: static;
      width: min(78%, 340px);
      height: auto;
      aspect-ratio: 715 / 894;
    }
    .projects {
      position: static;
      transform: none;
      align-items: center;
      gap: 16px;
    }
    .project-list { align-items: center; gap: 28px; }
    .project { font-size: clamp(38px, 12vw, 60px); }
    .home-cow { top: 22px; right: 20px; }
    .home-cow img { width: 34px; }
  }
</style>
</head>
<body>

  <div class="frame">

    <div class="photo">
      <img src="images/bandaid-portrait.jpg" alt="Two people embracing, a bandage across one hand">
    </div>

    <div class="projects">
      <p class="projects-label">Projects:</p>
      <div class="project-list">
        <a class="project" href="underberg.html">Underberg</a>
        <a class="project" href="https://jazpure.github.io/my-map/#text">My Map</a>
        <a class="project" href="https://glyphics.jasper-curtis.com/">Glyphics</a>
      </div>
    </div>

  </div>

  <a class="home-cow" href="index.html" aria-label="Home">
    <img src="images/cow-logo-white.png" alt="">
  </a>


  <script>
    /* Touch devices have no hover, so the tilt fires on tap and the link
       follows once it finishes. Pointer devices keep the CSS :hover. */
    (function () {
      var cow = document.querySelector('.home-cow');
      if (!cow || !window.matchMedia('(hover: none)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      cow.addEventListener('click', function (e) {
        if (cow.dataset.going) return;
        e.preventDefault();
        cow.dataset.going = '1';
        cow.classList.add('tapped');
        setTimeout(function () { window.location.href = cow.href; }, 220);
      });
    })();
  </script>

</body>
</html>
